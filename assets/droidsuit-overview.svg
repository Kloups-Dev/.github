<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc">
  <title id="title">DroidSuit — Fonctionnalités</title>
  <desc id="desc">Gestion d’appareils Android et iPhone sur Windows. Vue de l’appareil, sauvegardes locales, fichiers et applis, sans compte ni télémétrie. Bêta privée sur invitation.</desc>
